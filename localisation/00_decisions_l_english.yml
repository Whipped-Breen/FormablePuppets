 NAP_american_surrender.4.t:0 "The Renaming of Washington"
 NAP_american_surrender.4.desc:0 "Following the stunning victory of German forces, the time has come to destroy the last vestiges of democracy in America. Even now, the name of George Washington disgraces a major citiy in the new German America, mocking the soldiers who gave their lives to take it.\n\nThe "Assosciation of Veterans of the Weltkrieg" have presented the government with a suggestion to rectify this horrible state of affairs."
